# --- Core Settings ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g base-index 1
setw -g pane-base-index 1

# --- Window Naming Control ---
# Disables automatic renaming so your manual window names won't be overwritten
set -g allow-rename off
set -w -g automatic-rename off

# --- Keybindings ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind | split-window -h
bind - split-window -v

# --- Status Bar & Theme (Catppuccin Top Bar) ---
set -g status-position top

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory} #{E:@catppuccin_status_session} #{E:@catppuccin_status_date_time}"

# --- Borders ---
set -g pane-border-style "fg=black"
set -g pane-active-border-style "fg=white"

# --- Plugin Manager (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.1'

run '~/.tmux/plugins/tpm/tpm'
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"
