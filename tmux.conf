# --- Core Settings ---
set -g prefix `
unbind C-b
bind ` send-prefix

# --- look and feel ---
set -g mouse on
set -g escape-time 0
set -g repeat-time 1000
set -g history-limit 10000

set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

# indexing from 1
set -g base-index 1
setw -g pane-base-index 1

# --- Window Naming Control ---
# Disables automatic renaming so your manual window names won't be overwritten
set -g allow-rename off
set -w -g automatic-rename off

# --- Keybindings ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind | split-window -h
bind - split-window -v

bind f resize-pane -Z

bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# --- Minimal Monochrome Window Section (Matched to #181818) ---
set -g status-style "bg=#181818,fg=#585858"

# Inactive windows: subtle muted gray on exact terminal background
setw -g window-status-style "fg=#585858,bg=#181818"
setw -g window-status-separator "  "
setw -g window-status-format "#I:#W"

# Active window: soft charcoal pill (#262626) + pure white text
setw -g window-status-current-style "fg=#ffffff,bg=#262626,bold"
setw -g window-status-current-format "#[fg=#ffffff,bold] • #I:#W "
# --- Minimal Right Status (Date & Time) ---
set -g status-right-length 40
set -g status-right "#[fg=#585858]%b %d  #[fg=#a8a8a8]%H:%M "

set -g renumber-windows on

# --- Plugins ---
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'egel/tmux-gruvbox'
# set -g @tmux-gruvbox 'dark' # Options: 'dark', 'light', 'dark-soft'
#
# --- Borders ---
set -g pane-border-lines simple
set -g pane-border-style "fg=black,bright"
set -g pane-active-border-style "fg=magenta"

# --- Plugin Manager (TPM) ---
# run '~/.tmux/plugins/tpm/tpm'
